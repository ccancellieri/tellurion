# `#37`: the raster maps lane's contract tests drive the REAL `RasterSource`
# of both raster drivers, because a raster-maps test backed by a fake
# `RasterSource` would pin nothing about the budgets, the colormap
# classification or the fixed-slice selection this lane's whole claim is that
# it reuses. The only honest way to reach that code from outside either
# driver crate is the public `DriverFactory` -> `StorageDriver` ->
# `RasterSource` contract, which is exactly what a served map goes through
# anyway — the same reasoning, and the same DEV-only arrow,
# `tellurion-render`'s own colormap goldens already follow. Nothing in this
# crate's library depends on a driver, and the drivers still know nothing
# about this crate.
tellurion-cog = { workspace = true }
tellurion-zarr = { workspace = true }
