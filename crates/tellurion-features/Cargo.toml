[package]
name = "tellurion-features"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "OGC API - Features implementation for the Tellurion geospatial serving engine: collections, GeoJSON items, bbox and datetime filtering, keyset paging."
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tellurion-core = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
geojson = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
# Change-feed request/entry counters (`#115`) — already a dependency
# elsewhere in this workspace (`tellurion-core`'s own lane metrics), the
# same one Prometheus recorder every metric in this binary feeds.
metrics = { workspace = true }
# Only for downcasting `axum::body::to_bytes`'s error to `LengthLimitError`
# (`#91`) so a write-lane body-size refusal names the limit precisely rather
# than lumping every body-read failure under one status.
http-body-util = "0.1"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
async-trait = { workspace = true }
serde_yaml = { workspace = true }
