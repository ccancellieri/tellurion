<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Try Tellurion with your own geospatial data</title>
  <desc id="desc">Tellurion public preview card showing a public HTTPS resource becoming a temporary map layer, with COG, GeoParquet and ZIP Shapefile examples.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#75e6c4" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="globe">
      <circle cx="256" cy="256" r="224"/>
    </clipPath>
    <clipPath id="map-window">
      <rect x="748" y="102" width="372" height="414" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1200" height="627" fill="#071310"/>
  <rect width="1200" height="627" fill="url(#grid)"/>
  <circle cx="1090" cy="36" r="305" fill="#f5bd67" fill-opacity="0.06"/>
  <circle cx="1130" cy="650" r="360" fill="#75e6c4" fill-opacity="0.045"/>

  <g transform="translate(68 50) scale(.17)">
    <circle cx="256" cy="256" r="224" fill="#062a4b"/>
    <g clip-path="url(#globe)">
      <path fill="#24c7b5" d="M50 111c67-56 142-77 223-63 73 12 137 49 189 109-52-15-96-13-132 6-42 23-84 28-126 15-46-14-97-10-154 12z"/>
      <path fill="#10a99f" d="M38 161c62 25 121 30 178 14 49-14 93-15 133-3 39 12 81 13 125 3l-5 42c-52 24-102 27-150 8-46-18-88-18-128 0-45 20-95 22-151 5z"/>
      <path fill="#36c8f4" d="M18 221c80 24 157 31 231 20 76-11 157-9 245 7l-8 62c-62-5-116-2-162 11-28 8-43 24-43 49v105h-50V370c0-25-14-41-42-49-47-13-101-16-163-11z"/>
      <path fill="#159fd7" d="M36 304c52 4 101 17 147 39 25 12 38 32 38 60v77l-58-18c-11-51-30-83-58-98-21-12-45-19-73-22z"/>
      <path fill="#22b9e8" d="M291 350c53-27 113-42 181-46l-8 48c-34 5-61 16-82 33-25 21-40 53-46 96l-45 8z"/>
      <path fill="#ffb743" d="M42 344c49 10 86 34 111 71l20 45c-55-20-96-54-124-101z"/>
    </g>
    <circle cx="256" cy="256" r="224" fill="none" stroke="#0b466b" stroke-width="8"/>
  </g>

  <text x="165" y="84" fill="#eaf7f2" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">TELLURION</text>
  <text x="165" y="111" fill="#75e6c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2.4">PUBLIC PREVIEW</text>

  <line x1="69" y1="162" x2="69" y2="468" stroke="#75e6c4" stroke-width="2"/>
  <text x="100" y="234" fill="#eaf7f2" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="500" letter-spacing="-3">Bring your own</text>
  <text x="100" y="314" fill="#f5bd67" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="500" letter-spacing="-3.5">geospatial data.</text>
  <text x="101" y="371" fill="#9bb5ac" font-family="Arial, Helvetica, sans-serif" font-size="24">Paste a public HTTPS address. Inspect it. Put it on the map.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="1">
    <rect x="100" y="414" width="91" height="39" rx="3" fill="none" stroke="#75e6c4" stroke-opacity="0.7"/>
    <text x="125" y="439" fill="#75e6c4">COG</text>
    <rect x="203" y="414" width="150" height="39" rx="3" fill="none" stroke="#87bfff" stroke-opacity="0.7"/>
    <text x="222" y="439" fill="#87bfff">GEOPARQUET</text>
    <rect x="365" y="414" width="181" height="39" rx="3" fill="none" stroke="#f5bd67" stroke-opacity="0.7"/>
    <text x="384" y="439" fill="#f5bd67">ZIP SHAPEFILE</text>
  </g>

  <g clip-path="url(#map-window)">
    <rect x="748" y="102" width="372" height="414" fill="#0b1d19"/>
    <path d="M716 429C791 351 822 410 877 338S992 305 1152 202" fill="none" stroke="#75e6c4" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M710 460C785 382 834 446 894 371S1006 342 1155 238" fill="none" stroke="#75e6c4" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M724 389C798 311 817 368 862 301S975 268 1146 164" fill="none" stroke="#75e6c4" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M740 250L817 213 879 239 950 187 1045 232 1128 177" fill="none" stroke="#36c8f4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M792 520L841 396 930 420 994 337 1086 364" fill="none" stroke="#f5bd67" stroke-width="3" stroke-dasharray="7 9"/>
    <g fill="#75e6c4">
      <circle cx="817" cy="213" r="7"/><circle cx="879" cy="239" r="7"/><circle cx="950" cy="187" r="7"/><circle cx="1045" cy="232" r="7"/>
    </g>
    <path d="M940 283c0-26 21-47 47-47s47 21 47 47c0 35-47 88-47 88s-47-53-47-88z" fill="#f5bd67"/>
    <circle cx="987" cy="283" r="17" fill="#071310"/>
    <g fill="none" stroke="#9bb5ac" stroke-opacity="0.16">
      <path d="M760 154H1110M760 206H1110M760 258H1110M760 310H1110M760 362H1110M760 414H1110M760 466H1110"/>
      <path d="M800 116V506M852 116V506M904 116V506M956 116V506M1008 116V506M1060 116V506"/>
    </g>
  </g>
  <rect x="748" y="102" width="372" height="414" rx="8" fill="none" stroke="#75e6c4" stroke-opacity="0.32"/>
  <rect x="772" y="126" width="324" height="50" rx="4" fill="#071310" stroke="#75e6c4" stroke-opacity="0.4"/>
  <circle cx="793" cy="151" r="5" fill="#75e6c4"/>
  <text x="809" y="157" fill="#9bb5ac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">https://…/your-data</text>
  <rect x="776" y="462" width="182" height="35" rx="3" fill="#75e6c4"/>
  <text x="797" y="485" fill="#06110e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">TEMPORARY LAYER</text>

  <line x1="68" y1="550" x2="1132" y2="550" stroke="#75e6c4" stroke-opacity="0.22"/>
  <text x="69" y="585" fill="#eaf7f2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">No account. No upload. No persistent catalog.</text>
  <text x="1131" y="585" text-anchor="end" fill="#75e6c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">ccancellieri.github.io/tellurion-demos</text>
</svg>
