# Local dev / single-node bench stack: PostGIS + tellurion, config mounted
# from ./config. Run from the repo root:
#
#   docker compose -f deploy/compose/docker-compose.yml up
#
# On Apple Silicon the official `postgis/postgis` image is amd64-only (no
# arm64 manifest) and runs under Rosetta emulation; set POSTGIS_IMAGE to the
# arm64 community build for native performance:
#
#   POSTGIS_IMAGE=imresamu/postgis:16-3.4 docker compose -f deploy/compose/docker-compose.yml up
#
# DB_HOST_PORT lets the host port be moved (e.g. to 5433) to avoid colliding
# with another local Postgres.
services:
  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    environment:
      POSTGRES_DB: tellurion
      POSTGRES_USER: tellurion
      POSTGRES_PASSWORD: tellurion
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tellurion -d tellurion"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  tellurion:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tellurion:tellurion@db:5432/tellurion
      TELLURION_CONFIG: /etc/tellurion/config.yaml
      PORT: "8080"
    volumes:
      - ./config:/etc/tellurion:ro
    ports:
      - "8080:8080"

  # Optional one-off: creates and populates the `demo` table referenced by
  # config.yaml. Run once after the stack is up:
  #   docker compose -f deploy/compose/docker-compose.yml --profile seed run --rm seed
  seed:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    entrypoint: ["tellurion-ingest"]
    command: ["seed"]
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tellurion:tellurion@db:5432/tellurion

volumes:
  db-data:
