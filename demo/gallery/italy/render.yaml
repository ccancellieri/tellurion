services:
  - type: web
    name: tellurion-vector-rome
    runtime: docker
    repo: https://github.com/ccancellieri/tellurion
    branch: main
    dockerfilePath: ./demo/gallery/italy/Dockerfile
    dockerContext: ./demo/gallery/italy
    buildFilter:
      paths:
        - demo/gallery/italy/Dockerfile
        - demo/gallery/italy/deploy/render/vector.yaml
    region: frankfurt
    plan: free
    healthCheckPath: /readyz
    autoDeployTrigger: commit
