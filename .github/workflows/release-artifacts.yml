name: Release artifacts

on:
  push:
    # A semver tag pattern, not one frozen version: `scripts/release.sh` moves
    # the workspace version and names the matching stable or release-candidate
    # tag; this workflow builds whichever one arrives. It still creates only Actions
    # workflow artifacts -- release publication remains a separate, ungranted decision.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-audit:
    name: license policy audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Audit license policy
        shell: bash
        run: ./scripts/audit-license-policy.sh

      - name: Audit crates.io publication boundary
        shell: bash
        run: ./scripts/audit-crates-io-policy.sh

      - name: Audit publication licence
        shell: bash
        run: ./scripts/audit-publication-license.sh

  source-artifact:
    name: source archive and SBOM
    needs: [policy-audit]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify canonical UI third-party notice
        shell: bash
        run: |
          set -euo pipefail
          cd ui
          npm ci
          npm run build
          npm run build:public-demo
          cd ..
          generated_notice="${RUNNER_TEMP}/THIRD_PARTY_NOTICES.txt"
          python3 scripts/generate-ui-third-party-notices.py \
            --lockfile ui/package-lock.json \
            --package-root ui/node_modules \
            --operator-bundle crates/tellurion-server/ui/dist \
            --public-demo-bundle crates/tellurion-server/ui/public-demo-dist \
            --fallbacks ui/third-party-notice-fallbacks.json \
            --output "$generated_notice"
          cmp "$generated_notice" crates/tellurion-server/ui/THIRD_PARTY_NOTICES.txt
          expected_notice_sha256="$(tr -d '[:space:]' < ui/third-party-notice-sha256.txt)"
          actual_notice_sha256="$(shasum -a 256 "$generated_notice" | awk '{print $1}')"
          test "$actual_notice_sha256" = "$expected_notice_sha256"

      - name: Resolve workspace version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -Path Cargo.toml
          $number = '(?:0|[1-9]\d*)'
          $versionPattern = "$number\.$number\.$number(?:-rc\.$number)?"
          $prefix = '(?ms)^\[workspace\.package\][ \t\r]*$(?:(?!^\[).)*?^version[ \t\r]*=[ \t\r]*"('
          $suffix = ')"[ \t\r]*$'
          $pattern = $prefix + $versionPattern + $suffix
          $found = [regex]::Match($manifest, $pattern)
          if (-not $found.Success) {
            throw 'Cargo.toml has no [workspace.package] version = "MAJOR.MINOR.PATCH[-rc.N]"'
          }
          $version = $found.Groups[1].Value
          Write-Host "workspace version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify tag matches workspace version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v${{ steps.version.outputs.version }}") {
            throw "release tag must equal v${{ steps.version.outputs.version }}"
          }

      - name: Prepare source evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          public_core="${RUNNER_TEMP}/tellurion-public-core"
          dependency_summary="${RUNNER_TEMP}/dependency-audit-summary.json"
          dependency_inventory="${RUNNER_TEMP}/dependency-inventory.json"
          export_manifest="${RUNNER_TEMP}/public-core-export-manifest.json"
          test ! -e "$public_core"
          python3 scripts/audit-dependency-licenses.py \
            --output "$dependency_summary" \
            --inventory-output "$dependency_inventory"
          python3 scripts/export-public-core.py \
            --source . \
            --destination "$public_core" \
            --manifest "$export_manifest"
          python3 scripts/generate-third-party-notices.py \
            --inventory "$dependency_inventory" \
            --output "$public_core/THIRD_PARTY_NOTICES.json"
          cp "$public_core/THIRD_PARTY_NOTICES.json" dist/THIRD_PARTY_NOTICES.json
          cp crates/tellurion-server/ui/THIRD_PARTY_NOTICES.txt "$public_core/THIRD_PARTY_NOTICES.txt"
          cmp "$public_core/THIRD_PARTY_NOTICES.txt" crates/tellurion-server/ui/THIRD_PARTY_NOTICES.txt
          cp "$public_core/THIRD_PARTY_NOTICES.txt" dist/THIRD_PARTY_NOTICES.txt

      - name: Generate workspace SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ runner.temp }}/tellurion-public-core
          format: spdx-json
          output-file: dist/tellurion.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0

      - name: Create source archive
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          build_id="${GITHUB_SHA:0:12}"
          public_core="${RUNNER_TEMP}/tellurion-public-core"
          output="${GITHUB_WORKSPACE}/dist/tellurion-v${version}-source-${build_id}.zip"
          python3 - "$public_core" "$output" <<'PY'
          from pathlib import Path
          import stat
          import sys
          import zipfile

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(candidate for candidate in source.rglob("*") if candidate.is_file()):
                  relative = path.relative_to(source).as_posix()
                  info = zipfile.ZipInfo(relative, (1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | stat.S_IMODE(path.stat().st_mode)) << 16
                  archive.writestr(info, path.read_bytes())
          PY

      - name: Upload source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/tellurion-v*-source-*.zip
            dist/tellurion.spdx.json
            dist/THIRD_PARTY_NOTICES.json
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 7

  native-artifacts:
    name: ${{ matrix.target }}
    needs: [source-artifact]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download source evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-source-evidence

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}
          components: rust-docs

      - name: Verify pinned Rust toolchain
        run: rustc +1.97.1 --version --verbose

      - name: Configure static Windows CRT
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          "RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Collect native notice evidence
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $evidence_dir = Join-Path $env:RUNNER_TEMP "native-notice-evidence-$target"
          New-Item -ItemType Directory -Force -Path $evidence_dir | Out-Null
          $metadata = Join-Path $evidence_dir "cargo-metadata.json"
          $metadata_error = Join-Path $evidence_dir "cargo-metadata.error.txt"
          $notice_error = Join-Path $evidence_dir "native-notice.error.txt"
          $status = Join-Path $evidence_dir "STATUS"
          $provenance_path = Join-Path $evidence_dir "runtime-provenance.json"
          $ok = $true

          try {
            & cargo +1.97.1 fetch --locked --target $target 2> $metadata_error
            if ($LASTEXITCODE -ne 0) { $ok = $false }
          } catch {
            $_ | Out-String | Set-Content -Path $metadata_error
            $ok = $false
          }

          if ($ok) {
            try {
            & cargo +1.97.1 metadata --locked --offline --format-version 1 --filter-platform $target --features tellurion/ui > $metadata 2> $metadata_error
            if ($LASTEXITCODE -ne 0) { $ok = $false }
            } catch {
              $_ | Out-String | Set-Content -Path $metadata_error
              $ok = $false
            }
          }

          if ($ok) {
            try {
              & python3 scripts/generate-native-third-party-notices.py `
                --metadata $metadata `
                --target $target `
                --feature-profile 'server=default,ui;ingest=default' `
                --fallbacks distribution/native-notices/fallbacks.json `
                --workspace $PWD `
                --manifest (Join-Path $evidence_dir "RUST_THIRD_PARTY_NOTICES.json") `
                --text (Join-Path $evidence_dir "RUST_THIRD_PARTY_NOTICES.txt") 2> $notice_error
              if ($LASTEXITCODE -ne 0) { $ok = $false }
            } catch {
              $_ | Out-String | Set-Content -Path $notice_error
              $ok = $false
            }
          }

          try {
            $sysroot = (& rustc +1.97.1 --print sysroot).Trim()
            $rust_docs = Join-Path $sysroot "share/doc/rust"
            $stdlib_dir = Join-Path $evidence_dir "licenses/rust-stdlib"
            New-Item -ItemType Directory -Force -Path $stdlib_dir | Out-Null
            Copy-Item (Join-Path $rust_docs "COPYRIGHT.html") -Destination $stdlib_dir
            Copy-Item (Join-Path $rust_docs "COPYRIGHT-library.html") -Destination $stdlib_dir
            Copy-Item (Join-Path $rust_docs "licenses") -Destination $stdlib_dir -Recurse
          } catch {
            $_ | Out-String | Add-Content -Path $notice_error
            $ok = $false
          }

          try {
            Copy-Item distribution/native-notices/runtime-provenance.json -Destination $provenance_path
            $provenance = Get-Content -Raw -Path $provenance_path | ConvertFrom-Json
            if ($provenance.schema_version -ne 1 -or $provenance.rust_version -ne "1.97.1") {
              throw "runtime provenance does not identify schema 1 and Rust 1.97.1"
            }
            if ($target -eq "x86_64-unknown-linux-musl") {
              $musl = $provenance.linux_musl
              if ($musl.version -ne "1.2.5" -or
                  [string]::IsNullOrWhiteSpace($musl.copyright_path) -or
                  [string]::IsNullOrWhiteSpace($musl.copyright_sha256)) {
                throw "musl runtime provenance is incomplete"
              }
              $musl_source = Join-Path distribution/native-notices $musl.copyright_path
              $musl_dir = Join-Path $evidence_dir "licenses/musl"
              New-Item -ItemType Directory -Force -Path $musl_dir | Out-Null
              $musl_license = Join-Path $musl_dir "COPYRIGHT.txt"
              Copy-Item $musl_source -Destination $musl_license
              $actual_hash = (Get-FileHash -Algorithm SHA256 $musl_license).Hash.ToLowerInvariant()
              if ($actual_hash -ne $musl.copyright_sha256.ToLowerInvariant()) {
                throw "musl runtime license hash does not match checked-in provenance"
              }
              if ([string]::IsNullOrWhiteSpace($musl.source_url) -or
                  [string]::IsNullOrWhiteSpace($musl.source_sha256)) {
                throw "musl source archive provenance is incomplete"
              }
              $musl_archive = Join-Path $musl_dir "musl-1.2.5.tar.gz"
              Invoke-WebRequest -Uri $musl.source_url -OutFile $musl_archive
              $archive_hash = (Get-FileHash -Algorithm SHA256 $musl_archive).Hash.ToLowerInvariant()
              if ($archive_hash -ne $musl.source_sha256.ToLowerInvariant()) {
                throw "musl source archive hash does not match checked-in provenance"
              }
            }
          } catch {
            $_ | Out-String | Add-Content -Path $notice_error
            $ok = $false
          }

          @(
            "target=$target"
            "feature-profile=server=default,ui;ingest=default"
            if ($ok) { "status=collected" } else { "status=blocked" }
          ) | Set-Content -Path $status

      - name: Upload native notice diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-notice-diagnostics-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-notice-evidence-${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Resolve workspace version
        id: version
        shell: pwsh
        run: |
          # Archive identities derive from `[workspace.package] version` in the
          # checked-out manifest -- never from the ref name. A ref name may
          # contain `/` (any branch can start a workflow_dispatch run), so it
          # can never reach a path or an artifact name; the manifest version is
          # constrained to MAJOR.MINOR.PATCH[-rc.N] here and is therefore always
          # filesystem-safe.
          $manifest = Get-Content -Raw -Path Cargo.toml
          # `[ \t\r]*$` rather than `\s*$`: the Windows leg may check out CRLF,
          # and `\s` would let the match run past the line it is anchored to.
          $number = '(?:0|[1-9]\d*)'
          $versionPattern = "$number\.$number\.$number(?:-rc\.$number)?"
          $prefix = '(?ms)^\[workspace\.package\][ \t\r]*$(?:(?!^\[).)*?^version[ \t\r]*=[ \t\r]*"('
          $suffix = ')"[ \t\r]*$'
          $pattern = $prefix + $versionPattern + $suffix
          $found = [regex]::Match($manifest, $pattern)
          if (-not $found.Success) {
            throw 'Cargo.toml has no [workspace.package] version = "MAJOR.MINOR.PATCH[-rc.N]"'
          }
          $version = $found.Groups[1].Value
          Write-Host "workspace version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Install musl build dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake pkg-config

      - name: Gate prebuilt native binary release
        shell: pwsh
        run: |
          & bash ./scripts/check-native-binary-release-readiness.sh `
            --evidence (Join-Path $env:RUNNER_TEMP "native-notice-evidence-${{ matrix.target }}") `
            --target "${{ matrix.target }}" `
            --workspace $PWD

      - name: Build operator UI for native binary
        shell: pwsh
        run: |
          Push-Location ui
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "operator UI build failed" }
          } finally {
            Pop-Location
          }
          $notice = "$env:RUNNER_TEMP/release-source-evidence/THIRD_PARTY_NOTICES.txt"
          $noticeHash = (Get-FileHash -Algorithm SHA256 $notice).Hash
          foreach ($copy in @("crates/tellurion-server/ui/THIRD_PARTY_NOTICES.txt", "crates/tellurion-server/ui/dist/THIRD_PARTY_NOTICES.txt")) {
            if ((Get-FileHash -Algorithm SHA256 $copy).Hash -ne $noticeHash) {
              throw "operator UI notice differs from verified source evidence: $copy"
            }
          }

      - name: Build native binaries with operator UI
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo +1.97.1 build --release --locked --target ${{ matrix.target }} -p tellurion -p tellurion-ingest --features tellurion/ui

      - name: Package native artifact
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $version = "${{ steps.version.outputs.version }}"
          $package_name = "tellurion-v$version-$target"
          $package_dir = Join-Path "dist" $package_name
          $archive_name = if ($IsWindows) { "$package_name.zip" } else { "$package_name.tar.gz" }
          $archive = Join-Path (Join-Path (Get-Location) "dist") $archive_name
          $extension = if ($IsWindows) { ".exe" } else { "" }

          New-Item -ItemType Directory -Force -Path (Join-Path $package_dir "config") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $package_dir "docs") | Out-Null
          Copy-Item "target/$target/release/tellurion$extension" -Destination $package_dir
          Copy-Item "target/$target/release/tellurion-ingest$extension" -Destination $package_dir
          Copy-Item LICENSE, COPYRIGHT.md, README.md -Destination "$package_dir"
          Copy-Item COMMERCIAL-LICENSE.md -Destination "$package_dir"
          Copy-Item "$env:RUNNER_TEMP/release-source-evidence/THIRD_PARTY_NOTICES.json" -Destination "$package_dir"
          Copy-Item "$env:RUNNER_TEMP/release-source-evidence/THIRD_PARTY_NOTICES.txt" -Destination (Join-Path $package_dir "UI_THIRD_PARTY_NOTICES.txt")
          $evidence_dir = Join-Path $env:RUNNER_TEMP "native-notice-evidence-$target"
          Copy-Item (Join-Path $evidence_dir "RUST_THIRD_PARTY_NOTICES.json") -Destination "$package_dir"
          Copy-Item (Join-Path $evidence_dir "RUST_THIRD_PARTY_NOTICES.txt") -Destination "$package_dir"
          Copy-Item (Join-Path $evidence_dir "runtime-provenance.json") -Destination "$package_dir"
          Copy-Item (Join-Path $evidence_dir "licenses") -Destination "$package_dir" -Recurse
          Copy-Item config/example-geopackage.yaml -Destination "$package_dir/config"
          Copy-Item docs/licensing.md -Destination "$package_dir/docs"
          $crt = if ($target -eq "x86_64-pc-windows-msvc") { "static" } elseif ($target -eq "x86_64-unknown-linux-musl") { "static-musl" } else { "system" }
          $musl_license = if ($target -eq "x86_64-unknown-linux-musl") { "licenses/musl/COPYRIGHT.txt" } else { "not-applicable" }
          Set-Content -Path (Join-Path $package_dir 'BUILD-INFO') -Value @(
            "version=$version"
            "ref=$env:GITHUB_REF_NAME"
            "revision=$env:GITHUB_SHA"
            "target=$target"
            "server-features=default,ui"
            "ingest-features=default"
            "ui-bundle=operator"
            "crt=$crt"
            "rust-stdlib-licenses=licenses/rust-stdlib"
            "musl-license=$musl_license"
            "runtime-provenance=runtime-provenance.json"
            "rustc:"
            (& rustc +1.97.1 --version --verbose)
          )
          if ($IsWindows) {
            Compress-Archive -Path $package_dir -DestinationPath $archive -Force
          } else {
            & tar -C dist -czf $archive $package_name
          }

      - name: Smoke test packaged demo
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $version = "${{ steps.version.outputs.version }}"
          $extension = if ($IsWindows) { ".exe" } else { "" }
          $package_name = "tellurion-v$version-$target"
          $archive = if ($IsWindows) { "dist/$package_name.zip" } else { "dist/$package_name.tar.gz" }
          $smoke_dir = Join-Path $env:RUNNER_TEMP "tellurion-smoke-$target"
          $port = 18080
          $base_url = "http://127.0.0.1:$port"
          $demo_path = Join-Path $smoke_dir "demo.gpkg"

          New-Item -ItemType Directory -Force -Path $smoke_dir | Out-Null
          if ($IsWindows) {
            Expand-Archive -Path $archive -DestinationPath $smoke_dir -Force
          } else {
            & tar -xzf $archive -C $smoke_dir
          }
          $archive_dir = Join-Path $smoke_dir $package_name
          $evidence_dir = Join-Path $env:RUNNER_TEMP "native-notice-evidence-$target"
          $rust_notice = Join-Path $archive_dir "RUST_THIRD_PARTY_NOTICES.txt"
          $rust_manifest = Join-Path $archive_dir "RUST_THIRD_PARTY_NOTICES.json"
          foreach ($path in @($rust_notice, $rust_manifest, (Join-Path $archive_dir "runtime-provenance.json"),
              (Join-Path $archive_dir "licenses/rust-stdlib/COPYRIGHT.html"),
              (Join-Path $archive_dir "licenses/rust-stdlib/COPYRIGHT-library.html"))) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "native archive is missing $path" }
          }
          foreach ($name in @("RUST_THIRD_PARTY_NOTICES.txt", "RUST_THIRD_PARTY_NOTICES.json", "runtime-provenance.json")) {
            $archive_hash = (Get-FileHash -Algorithm SHA256 (Join-Path $archive_dir $name)).Hash
            $evidence_hash = (Get-FileHash -Algorithm SHA256 (Join-Path $evidence_dir $name)).Hash
            if ($archive_hash -ne $evidence_hash) { throw "native archive notice differs from pre-archive evidence: $name" }
          }
          $manifest = Get-Content -Raw -Path $rust_manifest | ConvertFrom-Json
          $provenance = Get-Content -Raw -Path (Join-Path $archive_dir "runtime-provenance.json") | ConvertFrom-Json
          if ($provenance.schema_version -ne 1 -or $provenance.rust_version -ne "1.97.1") {
            throw "native archive runtime provenance is invalid"
          }
          if ($manifest.declared_target -ne $target -or
              $manifest.declared_feature_profile -ne "server=default,ui;ingest=default" -or
              $manifest.text_sha256 -ne (Get-FileHash -Algorithm SHA256 $rust_notice).Hash.ToLowerInvariant()) {
            throw "native archive notice manifest does not bind the target, feature profile, and text hash"
          }
          $evidence_licenses = Join-Path $evidence_dir "licenses"
          $archive_licenses = Join-Path $archive_dir "licenses"
          $evidence_license_files = @(Get-ChildItem -File -Recurse $evidence_licenses | ForEach-Object {
            [System.IO.Path]::GetRelativePath($evidence_licenses, $_.FullName).Replace('\', '/')
          } | Sort-Object)
          $archive_license_files = @(Get-ChildItem -File -Recurse $archive_licenses | ForEach-Object {
            [System.IO.Path]::GetRelativePath($archive_licenses, $_.FullName).Replace('\', '/')
          } | Sort-Object)
          if (($evidence_license_files -join "`n") -cne ($archive_license_files -join "`n")) {
            throw "native archive license inventory differs from pre-archive evidence"
          }
          foreach ($relative in $evidence_license_files) {
            $evidence_license = Join-Path $evidence_licenses $relative
            $archive_license = Join-Path $archive_licenses $relative
            if ((Get-FileHash -Algorithm SHA256 $evidence_license).Hash -ne
                (Get-FileHash -Algorithm SHA256 $archive_license).Hash) {
              throw "native archive license differs from pre-archive evidence: $relative"
            }
          }
          if ($target -eq "x86_64-unknown-linux-musl" -and
              -not (Test-Path (Join-Path $archive_dir "licenses/musl/COPYRIGHT.txt") -PathType Leaf)) {
            throw "Linux musl archive is missing musl runtime license evidence"
          }
          if ($target -eq "x86_64-unknown-linux-musl") {
            $musl_archive_hash = (Get-FileHash -Algorithm SHA256 (Join-Path $archive_dir "licenses/musl/COPYRIGHT.txt")).Hash.ToLowerInvariant()
            if ($musl_archive_hash -ne $provenance.linux_musl.copyright_sha256.ToLowerInvariant()) {
              throw "packaged musl runtime license differs from checked-in provenance"
            }
            $musl_source_archive = Join-Path $archive_dir "licenses/musl/musl-1.2.5.tar.gz"
            if (-not (Test-Path $musl_source_archive -PathType Leaf)) {
              throw "Linux musl archive is missing the complete source license archive"
            }
            $musl_source_hash = (Get-FileHash -Algorithm SHA256 $musl_source_archive).Hash.ToLowerInvariant()
            if ($musl_source_hash -ne $provenance.linux_musl.source_sha256.ToLowerInvariant()) {
              throw "packaged musl source archive differs from checked-in provenance"
            }
          }
          $ingest = Join-Path (Join-Path $smoke_dir $package_name) "tellurion-ingest$extension"
          $process = Start-Process -FilePath $ingest -ArgumentList @("demo", "--path", $demo_path, "--port", $port) -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $health = Invoke-WebRequest -Uri "$base_url/healthz" -UseBasicParsing
                if ($health.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {
                $process.Refresh()
                if ($process.HasExited) {
                  throw "tellurion-ingest demo exited before /healthz became ready"
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) {
              throw "timed out waiting for /healthz"
            }
            $items = Invoke-WebRequest -Uri "$base_url/public/features/catalogs/default/collections/demo/items?limit=1" -UseBasicParsing
            if ($items.StatusCode -ne 200) {
              throw "demo items endpoint returned HTTP $($items.StatusCode)"
            }
            $uiIndex = Join-Path $smoke_dir "operator-index.html"
            $ui = Invoke-WebRequest -Uri "$base_url/ui/" -UseBasicParsing -OutFile $uiIndex -PassThru
            if ($ui.StatusCode -ne 200 -or
                (Get-FileHash -Algorithm SHA256 $uiIndex).Hash -ne
                (Get-FileHash -Algorithm SHA256 "crates/tellurion-server/ui/dist/index.html").Hash) {
              throw "packaged server did not serve the built operator UI"
            }
            $controlIndex = Join-Path $smoke_dir "control-index.html"
            $control = Invoke-WebRequest -Uri "$base_url/ui/control" -UseBasicParsing -OutFile $controlIndex -PassThru
            if ($control.StatusCode -ne 200 -or
                (Get-FileHash -Algorithm SHA256 $controlIndex).Hash -ne
                (Get-FileHash -Algorithm SHA256 $uiIndex).Hash) {
              throw "packaged server did not serve the control interface"
            }
            $assetPaths = @([regex]::Matches((Get-Content -Raw $uiIndex), '(?:src|href)="(?<path>\./assets/[^"/]+\.(?:js|css))"') |
              ForEach-Object { $_.Groups['path'].Value } | Sort-Object -Unique)
            if (-not ($assetPaths | Where-Object { $_ -match '\.js$' }) -or
                -not ($assetPaths | Where-Object { $_ -match '\.css$' })) {
              throw "operator index must reference JavaScript and CSS assets"
            }
            foreach ($assetPath in $assetPaths) {
              $assetFile = Join-Path $smoke_dir ([System.IO.Path]::GetFileName($assetPath))
              $assetUrl = "$base_url/ui/" + $assetPath.Substring(2)
              $assetResponse = Invoke-WebRequest -Uri $assetUrl -UseBasicParsing -OutFile $assetFile -PassThru
              if ($assetResponse.StatusCode -ne 200 -or
                  (Get-FileHash -Algorithm SHA256 $assetFile).Hash -ne
                  (Get-FileHash -Algorithm SHA256 (Join-Path "crates/tellurion-server/ui/dist" $assetPath)).Hash) {
                throw "packaged server operator asset differs from the build: $assetPath"
              }
            }
            $uiNotice = Join-Path $smoke_dir "ui-notice.txt"
            $noticeResponse = Invoke-WebRequest -Uri "$base_url/ui/THIRD_PARTY_NOTICES.txt" -UseBasicParsing -OutFile $uiNotice -PassThru
            if ($noticeResponse.StatusCode -ne 200 -or
                (Get-FileHash -Algorithm SHA256 $uiNotice).Hash -ne
                (Get-FileHash -Algorithm SHA256 (Join-Path (Join-Path $smoke_dir $package_name) "UI_THIRD_PARTY_NOTICES.txt")).Hash) {
              throw "packaged server UI notice differs from the archive copy"
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              $process.Kill($true)
              $process.WaitForExit()
            }
          }

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/tellurion-v${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/tellurion-v${{ steps.version.outputs.version }}-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  release-candidate:
    name: aggregate release candidate
    needs: [source-artifact, native-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Assemble aggregate checksums
        shell: bash
        run: |
          shopt -s nullglob
          source_archives=(dist/tellurion-v*-source-*.zip)
          native_archives=(dist/tellurion-v*.tar.gz dist/tellurion-v*-pc-windows-msvc.zip)
          if [ "${#source_archives[@]}" -ne 1 ]; then
            echo "expected exactly one source archive, found ${#source_archives[@]}" >&2
            exit 1
          fi
          if [ "${#native_archives[@]}" -ne 2 ]; then
            echo "expected exactly two native archives, found ${#native_archives[@]}" >&2
            exit 1
          fi
          test -f dist/tellurion.spdx.json
          test -f dist/THIRD_PARTY_NOTICES.json
          test -f dist/THIRD_PARTY_NOTICES.txt
          unzip -Z1 "${source_archives[0]}" | grep -Fx THIRD_PARTY_NOTICES.json >/dev/null
          unzip -Z1 "${source_archives[0]}" | grep -Fx THIRD_PARTY_NOTICES.txt >/dev/null
          for archive in dist/tellurion-v*.tar.gz; do
            tar -tzf "$archive" | grep -E '/THIRD_PARTY_NOTICES\.json$' >/dev/null
            tar -tzf "$archive" | grep -E '/RUST_THIRD_PARTY_NOTICES\.json$' >/dev/null
            tar -tzf "$archive" | grep -E '/RUST_THIRD_PARTY_NOTICES\.txt$' >/dev/null
            tar -tzf "$archive" | grep -E '/licenses/musl/musl-1\.2\.5\.tar\.gz$' >/dev/null
          done
          for archive in dist/tellurion-v*-pc-windows-msvc.zip; do
            unzip -Z1 "$archive" | grep -E '/THIRD_PARTY_NOTICES\.json$' >/dev/null
            unzip -Z1 "$archive" | grep -E '/RUST_THIRD_PARTY_NOTICES\.json$' >/dev/null
            unzip -Z1 "$archive" | grep -E '/RUST_THIRD_PARTY_NOTICES\.txt$' >/dev/null
          done
          (
            cd dist
            shasum -a 256 tellurion-v*.tar.gz tellurion-v*.zip tellurion.spdx.json THIRD_PARTY_NOTICES.json THIRD_PARTY_NOTICES.txt > SHA256SUMS
          )

      - name: Attest release archives
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/tellurion-v*.tar.gz
            dist/tellurion-v*.zip

      - name: Attest the source SBOM
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/tellurion-v*-source-*.zip
          sbom-path: dist/tellurion.spdx.json

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tellurion-v${{ needs.source-artifact.outputs.version }}-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
